<body>

<div class="wrap">

  <div class="franja" id="franja">
    <div class="dato" id="reloj"></div>
  </div>

  <header class="hero">
    <h1>Algunas de mis herramientas</h1>
  </header>

  <main id="filas"></main>

  <footer class="foot">
    <p class="stack">.NET · C# · Python · React · Next.js · TypeScript · EF Core · SQLite · PostgreSQL · MySQL · MCP · LiveKit · PWA · Windows</p>
  </footer>

</div>

<script src="/temas.js?v=21"></script>
<script src="/taller.js?v=21"></script>
<script src="/franja.js?v=21"></script>
<script>
"use strict";

// Los proyectos viven en proyectos.json: la misma fuente que usa la home local.
// Para agregar o cambiar algo se edita ese archivo, no este.

fetch("/proyectos.json", {cache: "no-cache"})
  .then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  })
  .then(function (datos) {
    Taller.filas(document.getElementById("filas"), datos.grupos, {base: "/"});
  })
  .catch(function () {
    var p = document.createElement("p");
    p.className = "aviso";
    p.textContent = "No se pudo cargar la lista de proyectos. Probá recargar la página.";
    document.getElementById("filas").appendChild(p);
  });
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
