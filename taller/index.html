<script>
"use strict";

// Los proyectos viven en proyectos.json: la misma fuente que usa la home local.
// Para agregar o cambiar algo se edita ese archivo, no este.

/* Datos estructurados (schema.org) para los buscadores: la lista de proyectos que se
   pueden abrir, cada uno con su tipo. Salen del mismo proyectos.json, así no se
   desactualizan cuando entra uno nuevo. */
function datosEstructurados(grupos) {
  var TIPO = {"Juegos": "VideoGame", "Sitios web": "WebSite"};
  var items = [];
  grupos.forEach(function (g) {
    g.items.forEach(function (p) {
      var url = Taller.linkSeguro(p.url);
      if (!url || !/^https:/.test(url)) return;
      var cosa = {"@type": TIPO[g.titulo] || "SoftwareApplication", name: p.nombre, url: url};
      if (p.tag) cosa.description = p.tag;
      if (cosa["@type"] === "SoftwareApplication") cosa.applicationCategory = "WebApplication";
      items.push({"@type": "ListItem", position: items.length + 1, item: cosa});
    });
  });
  var s = document.createElement("script");
  s.type = "application/ld+json";
  s.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    name: "El taller de Nico",
    url: "https://fnguerrero.github.io/taller/",
    inLanguage: "es-AR",
    author: {"@type": "Person", name: "Nico Guerrero", url: "https://fnguerrero.github.io/taller/"},
    mainEntity: {"@type": "ItemList", numberOfItems: items.length, itemListElement: items}
  });
  document.head.appendChild(s);
}

fetch("/proyectos.json", {cache: "no-cache"})
  .then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  })
  .then(function (datos) {
    Taller.filas(document.getElementById("filas"), datos.grupos, {base: "/"});
    datosEstructurados(datos.grupos);
  })
  .catch(function () {
    var p = document.createElement("p");
    p.className = "aviso";
    p.textContent = "No se pudo cargar la lista de proyectos. Probá recargar la página.";
    document.getElementById("filas").appendChild(p);
  });
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
